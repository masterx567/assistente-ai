# Pipeline degli aggiornamenti, passo 1 (Daniele 2026-10-29, .claude/context/pipeline-aggiornamenti.md).
# Domenica sera ogni 2 settimane (settimane pari): dossier, Claude Code propone fino a 5 idee, Issue con l'etichetta
# "idea" e messaggio a Daniele su Telegram con i bottoni ✅. A mano: Actions → Idee → Run workflow.
# Repo PUBBLICO: niente artefatti, niente stampa del dossier.
name: Idee

on:
  schedule:
    - cron: "0 18 * * 0" # domenica alle 18 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: idee
  cancel-in-progress: false

jobs:
  idee:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Turno (solo settimane pari, a mano sempre)
        id: turno
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ $(( 10#$(date +%V) % 2 )) -ne 0 ]; then
            echo "Settimana dispari: niente giro"; echo "salta=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.turno.outputs.salta != '1'
        with:
          fetch-depth: 0

      - name: Dossier delle ultime 2 settimane
        if: steps.turno.outputs.salta != '1'
        run: python3 .github/pipeline/dossier.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Claude propone le idee
        if: steps.turno.outputs.salta != '1'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "Leggi .github/prompts/idee.md e segui le istruzioni. Scrivi solo dossier/idee.json."
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Write,WebSearch,WebFetch"

      - name: Issue e messaggio a Daniele
        if: steps.turno.outputs.salta != '1'
        run: python3 .github/pipeline/pubblica_idee.py dossier/idee.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROGETTO: ai
          NOME: AssistenteAI
